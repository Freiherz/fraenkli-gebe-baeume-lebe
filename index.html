<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fränkli gebe, Bäume lebe – 1 CHF = 1 Baum</title>
  <meta name="description" content="Spende 1 Franken, wir pflanzen einen Baum. Ein Studierendenprojekt.">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="wrap">
    <header>
      <nav class="lang-switch" aria-label="Sprache / Langue / Language">
        <button type="button" data-lang="de" aria-pressed="true">DE</button>
        <button type="button" data-lang="fr" aria-pressed="false">FR</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </nav>
      <h1 data-i18n="title">Fränkli gebe, Bäume lebe</h1>
      <p class="tagline" data-i18n="tagline"></p>
    </header>

    <main>
      <section class="card" id="donate">
        <h2 data-i18n="donate.h2"></h2>
        <p class="lead" data-i18n="donate.lead"></p>
        <img id="qr" class="qr" src="assets/qr-placeholder.svg" width="240" height="240" alt="" data-i18n-alt="donate.qr.alt">
        <ol class="steps" data-i18n-list="donate.steps"></ol>
        <p class="note" data-i18n="donate.note"></p>
      </section>

      <section class="card" id="about">
        <h2 data-i18n="about.h2"></h2>
        <p data-i18n="about.text"></p>
      </section>
    </main>

    <footer>
      <p data-i18n="footer.note"></p>
      <p class="privacy" data-i18n="footer.privacy"></p>
    </footer>
  </div>

  <script src="assets/i18n.js"></script>
  <script src="assets/logic.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
