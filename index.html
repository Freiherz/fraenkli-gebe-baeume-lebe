<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fränkli gebe, Bäume lebe – 1 CHF = 1 Baum</title>
  <meta name="description" content="Spende 1 Franken, wir pflanzen einen Baum. Gratis am Gewinnspiel teilnehmen und 50 CHF gewinnen.">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="wrap">
    <header>
      <nav class="lang-switch" aria-label="Sprache / Langue / Language">
        <button type="button" data-lang="de" aria-pressed="true">DE</button>
        <button type="button" data-lang="fr" aria-pressed="false">FR</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </nav>
      <h1 data-i18n="title">Fränkli gebe, Bäume lebe</h1>
      <p class="tagline" data-i18n="tagline"></p>
    </header>

    <main>
      <section class="card" id="donate">
        <h2 data-i18n="donate.h2"></h2>
        <p class="lead" data-i18n="donate.lead"></p>
        <img id="qr" class="qr" src="assets/qr-placeholder.svg" width="240" height="240" alt="" data-i18n-alt="donate.qr.alt">
        <ol class="steps" data-i18n-list="donate.steps"></ol>
        <p class="note" data-i18n="donate.note"></p>
      </section>

      <section class="card" id="draw">
        <h2 data-i18n="draw.h2"></h2>
        <p class="lead" data-i18n="draw.lead"></p>
        <p class="deadline"><span data-i18n="draw.deadline"></span> <span id="deadline"></span></p>

        <form id="entry">
          <label for="email" data-i18n="form.email"></label>
          <input id="email" name="email" type="email" required autocomplete="email" inputmode="email" maxlength="120">

          <label for="phone">
            <span data-i18n="form.phone"></span>
            <span class="hint" data-i18n="form.phone.hint"></span>
          </label>
          <input id="phone" name="phone" type="tel" required autocomplete="tel" inputmode="tel" pattern="[+0-9 ()/-]{7,20}" maxlength="20">

          <fieldset>
            <legend data-i18n="form.donated"></legend>
            <div class="radios">
              <label><input type="radio" name="donated" value="yes" required> <span data-i18n="form.yes"></span></label>
              <label><input type="radio" name="donated" value="no" required> <span data-i18n="form.no"></span></label>
            </div>
          </fieldset>

          <fieldset id="donation-details" hidden>
            <label for="why" data-i18n="form.why"></label>
            <textarea id="why" name="why" maxlength="1000" data-i18n-placeholder="form.why.placeholder"></textarea>

            <label for="amount" data-i18n="form.amount"></label>
            <input id="amount" name="amount" type="number" min="1" step="0.05" inputmode="decimal">
          </fieldset>

          <label class="visually-hidden" aria-hidden="true">Website
            <input name="website" type="text" tabindex="-1" autocomplete="off">
          </label>

          <label class="check">
            <input name="consent" type="checkbox" required>
            <span data-i18n="form.consent"></span>
          </label>

          <button type="submit" class="primary" data-i18n="form.submit"></button>
        </form>
        <p class="status" role="status" aria-live="polite"></p>

        <details id="terms">
          <summary data-i18n="terms.summary"></summary>
          <ol data-i18n-list="terms.items"></ol>
        </details>
      </section>
    </main>

    <footer>
      <p data-i18n="footer.note"></p>
    </footer>
  </div>

  <script>
    // Fill in after deploying apps-script/Code.gs as a web app (see README).
    window.APP_CONFIG = { endpoint: 'PASTE_APPS_SCRIPT_WEB_APP_URL' };
  </script>
  <script src="assets/i18n.js"></script>
  <script src="assets/logic.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
